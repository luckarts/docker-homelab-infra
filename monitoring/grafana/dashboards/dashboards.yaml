# =============================================================================
# dashboards.yaml — Provisionning automatique des dashboards Grafana
# =============================================================================
# Charge tous les dashboards JSON du dossier dashboards/ au démarrage.
# Pas besoin de les importer manuellement dans l'UI Grafana.
# =============================================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards