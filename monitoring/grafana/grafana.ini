# =============================================================================
# grafana.ini — Configuration serveur Grafana
# =============================================================================
# Config minimale pour :
#   - Reverse proxy Traefik (root_url, domain)
#   - Auth anonyme en Viewer (pratique en dev, restreint par IP whitelist Traefik)
#   - Unified alerting (Grafana 13+)
#
# Piège : server.root_url doit correspondre EXACTEMENT à l'URL publique.
#   Si c'est https://monitoring.bachelart.fr, toutes les redirections
#   pointeront vers cette URL. Mettre http://localhost:3000 cassera les liens.
# =============================================================================

[server]
domain = monitoring.bachelart.fr
root_url = https://monitoring.bachelart.fr

[security]
admin_user = admin

[auth.anonymous]
enabled = true
org_role = Viewer

[unified_alerting]
enabled = true