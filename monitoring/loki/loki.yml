# =============================================================================
# loki.yml — Configuration minimale Loki
# =============================================================================
# Loki reçoit les logs de Promtail (push) et les stocke.
# Conçu pour Docker : indexe les LABELS, pas le contenu des logs.
#
# Piège connu — permissions UID :
#   Loki tourne avec l'UID 10001 à l'intérieur du conteneur.
#   Si /data/loki appartient à root (UID 0), Loki crash au démarrage.
#   Solution : service loki-init qui chown avant le démarrage.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  ingestion_rate_mb: 10
  retention_period: 720h   # 30 jours

compactor:
  working_directory: /data/loki/compactor
  shared_store: filesystem