# =============================================================================
# prometheus.yml — Configuration de scraping Prometheus
# =============================================================================
# Prometheus scrape les metriques de l'infra partagee :
#   - Traefik      (port 8082) : req/s, latence, codes HTTP par routeur
#   - node-exporter (port 9100) : CPU, RAM, disque du HOST
#   - cAdvisor     (port 8080) : CPU, RAM, reseau par container
#   - CrowdSec     (port 6060) : decisions, IPs bannies, securite
#   - Lui-meme     (port 9090) : auto-monitoring
#
# Les cibles sont des noms DNS Docker — résolus sur monitoring-network.
# Tant qu'un service est sur ce réseau, Prometheus peut le scraper.
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # ── Traefik ────────────────────────────────────────────────────────────
  # Métriques HTTP : requêtes/s, latence, codes 2xx/4xx/5xx par routeur
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']

  # ── node-exporter ──────────────────────────────────────────────────────
  # Métriques du HOST : CPU total, RAM totale, disque, réseau
  # Scrapé sur localhost:9100 (network_mode: host = pas de DNS Docker)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  # ── cAdvisor ───────────────────────────────────────────────────────────
  # Métriques PAR CONTAINER : CPU, RAM, réseau
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── CrowdSec ───────────────────────────────────────────────────────────
  # Métriques de sécurité : IPs bannies, décisions actives, requêtes analysées
  - job_name: 'crowdsec'
    static_configs:
      - targets: ['crowdsec:6060']

  # ── Auto-monitoring ────────────────────────────────────────────────────
  # Vérifie que Prometheus lui-même tourne
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

rule_files:
  - '/etc/prometheus/rules/*.yml'