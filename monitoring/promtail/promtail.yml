# =============================================================================
# promtail.yml — Collecteur de logs Docker vers Loki
# =============================================================================
# Promtail découvre les containers via docker_sd_configs (socket Docker)
# et envoie leurs logs à Loki avec des labels enrichis.
#
# Labels ajoutés :
#   - container_name   : nom du container (ex: traefik, prometheus)
#   - compose_project  : nom du projet docker-compose (ex: monitoring)
#   - compose_service  : nom du service dans le compose (ex: grafana)
#
# Utilisation dans Grafana Explore (Loki) :
#   {compose_project="traefik"}          → logs de Traefik
#   {compose_project="monitoring"}       → logs de la stack monitoring
#   {container_name="registry"}          → logs du registry
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'job'
        replacement: '${1}'